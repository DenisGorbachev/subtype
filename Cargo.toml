[package]
name = "subtype"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
description = "Better newtypes"
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/DenisGorbachev/subtype"
repository = "https://github.com/DenisGorbachev/subtype"
readme = "README.md"
keywords = ["newtype", "validation"]
categories = ["rust-patterns"]
exclude = [
    ".*",
    "*.local.*",
    "doc/dev",
    "specs",
    "AGENTS.ts",
    "README.ts",
    "AGENTS*.md",
    "CLAUDE*.md",
    "deno.lock",
    "deno.json",
    "commitlint.config.mjs",
    "fnox.toml",
    "lefthook.yml",
    "mise.toml",
    "rumdl.toml",
    "rustfmt.toml",
    ".yolobox"
]

[package.metadata.details]
title = "Subtype"
tagline = ""
summary = ""
announcement = ""
readme = { generate = false }

[dependencies]
derive_more = { version = "1.0.0", features = ["error"] }
num-traits = { version = "0.2.0", optional = true }
pretty-type-name = "1.0.1"
serde = { version = "1.0.0", optional = true, features = ["derive"] }
standard-traits = { git = "https://github.com/DenisGorbachev/standard-traits" }
time = { version = "0.3.47", optional = true }

[dev-dependencies]
assert_matches = { version = "1.5.0" }
derive_more = { version = "1.0.0", features = ["full"] }
prae = "0.8"
rustc-hash = "2.1"
thiserror = "2.0"
url = "2.5"
errgonomic = { git = "https://github.com/DenisGorbachev/errgonomic" }
